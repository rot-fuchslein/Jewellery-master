<section class="page-card auth-card">
  <p class="kicker">{{ 'login.subtitle' | translate }}</p>
  <h1>{{ 'login.heading' | translate }}</h1>

  <form class="form" (submit)="$event.preventDefault()">
    <label>
      <span>{{ 'login.email' | translate }}</span>
      <input type="email" [(ngModel)]="email" name="email" placeholder="email@example.com" />
    </label>

    <label>
      <span>{{ 'login.password' | translate }}</span>
      <input type="password" [(ngModel)]="password" name="password" />
    </label>

    <a class="link" href="#">{{ 'login.forgot' | translate }}</a>

    <button type="submit">{{ 'login.submit' | translate }}</button>

    <p class="hint">{{ 'login.registerPrompt' | translate }} <a class="link" href="#">{{ 'login.registerLink' | translate }}</a></p>
  </form>
</section>
