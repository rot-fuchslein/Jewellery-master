<header class="topbar">
  <a routerLink="/" class="brand">{{ 'app.title' | translate }}</a>

  <nav class="nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">{{ 'nav.home' | translate }}</a>
    <a routerLink="/catalog" routerLinkActive="active">{{ 'nav.catalog' | translate }}</a>
    <a routerLink="/login" routerLinkActive="active">{{ 'nav.login' | translate }}</a>
  </nav>

  <label class="lang-switcher">
    <span>{{ 'app.language' | translate }}</span>
    <select [(ngModel)]="selectedLanguage" (ngModelChange)="changeLanguage($event)">
      <option *ngFor="let language of languages" [value]="language.code">{{ language.label }}</option>
    </select>
  </label>
</header>

<main class="content">
  <router-outlet />
</main>
